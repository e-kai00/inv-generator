<!DOCTYPE html>
<html lang="en-uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>iGenerator</title>
</head>

<body>
    <main class="container">
        <h1 class="heading">Генератор інвойса</h1>

        <!-- input fields -->
        <div class="warning-msg"></div>
        <div>
            <div class="converter input-container">
                <input id="usd" class="display" type="text" name="usd" placeholder="$">
                <input id="rate" class="display" type="text" name="usd" placeholder="Курс долара">
                <input id="converter-btn" type="button" class="btn" value="Згенерувати">
            </div>
            <p class="input-hint">Введіть суму в $. Наприклад: 750.70</p>
        </div>
        <div class="uah-container">
            <div id="invoice-amount" class="display inside"></div>
            <span>грн</span>
        </div>

        <!-- generated rows of results -->
        <div>
            <div id="results"></div>
        </div>

        <!-- accept or re-generate new -->
        <div class="btn-container">
            <button id="clear" class="btn">Очистити</button>
            <button id="accept" class="btn">Завантажити</button>
        </div>


        <!-- convert to pdf and download -->
        <!-- <a href="#" id="download">Завантажити PDF</a> -->
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.3/html2pdf.bundle.min.js"
        integrity="sha512-YcsIPGdhPK4P/uRW6/sruonlYj+Q7UHWeKfTAkBW+g83NKM+jMJFJ4iAPfSnVp7BKD4dKMHmVSvICUbE/V1sSw=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="script.js"></script>
</body>

</html>
